name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm -F app build
      # The SW handlers are serialized into sw.js; bare module-scope
      # identifiers (e.g. workbox's createPartialResponse) become
      # ReferenceErrors in production. Fail here instead.
      - name: Guard service worker inlining
        run: |
          test ! -e packages/app/dist/sw.js || ! grep -q "createPartialResponse" packages/app/dist/sw.js
          grep -q "Content-Range" packages/app/dist/sw.js
      - run: pnpm prettier --check --ignore-unknown .
